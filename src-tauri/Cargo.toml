[package]
name = "swattedwtf-app"
version = "0.1.9"
description = "Open-source desktop client for swatted.wtf"
authors = ["swatted.wtf"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swattedwtf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP + session. rustls rather than the system OpenSSL so Windows and Linux
# builds behave identically and the Linux build needs no extra system dep.
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
thiserror = "2"

# Integrity manifest verification.
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
base64 = "0.22"


# Debug builds of the full Tauri dependency tree carry several GB of debug
# symbols, which is more than the build host has to spare. line-tables-only
# keeps panic backtraces useful (file and line still resolve) while dropping
# the variable-level DWARF that accounts for most of the size, and it links
# noticeably faster too. Release builds are unaffected.
[profile.dev]
debug = "line-tables-only"

# Windows-only: clipping the frameless windows to a rounded region (Gdi), and
# reading the extended window style for the transparency diagnostic.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
