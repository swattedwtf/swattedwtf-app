name: ci

on:
  push:
  pull_request:
  # Manual trigger, so a release can be rebuilt without moving the tag.
  workflow_dispatch:

# A PR branch in this repo triggers both `push` and `pull_request`. Grouping by
# ref keeps only the newest run of each alive instead of paying for both twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    # Pinned to the same image the release workflow builds on, so a glibc or
    # WebKitGTK difference cannot pass CI and then fail the release.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri links against WebKitGTK and friends, so the Rust crates do not
      # even compile without these present.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Run the frontend tests
        run: npm test

      # `npm run build` is `tsc && vite build`, so this is the type check too.
      - name: Build the frontend
        run: npm run build

      - name: Run the Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Lint the Rust code
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
